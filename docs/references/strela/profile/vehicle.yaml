# Strela (converted RS-18 / UR-100NUTTH / SS-19 ICBM), NPO Mashinostroyenia.
# Source: Strela Launch Vehicle User Manual, Second Edition, 1999 (63 pp), ../180618736-Strela.pdf.
#
# Tags:  [UM s x] = manual section x   [UM f x] = figure x   [UM t x] = table x
#        [der]    = derived here from UM values (method in README.md)
#        [ext]    = not in the manual; public knowledge, verify before relying on it
#        [rockot] = same hardware as Rockot stages 1-2, see configs/orbital/rockot.yaml
kind: launch_vehicle_profile

vehicle:
  name: Strela
  heritage: RS-18 ICBM, structure and systems used unchanged; the warhead is replaced by the space head section   # [UM s 1]
  stages_count: 2           # + mechanisms and instruments section (MIS) acting as a single-burn kick stage [UM s 2]
  liftoff_mass: 105000      # kg, maximum (~) [UM s 2]
  diameter: 2.5             # m [UM s 2]
  length: {shs1: 26.0, shs2: 29.2}   # m [UM s 2]
  container_diameter: 2.9   # m, transport-and-launch container [UM s 2]
  propellants: N2O4 / UDMH  # [UM s 2]
  payload_range: "2000 kg to 200 km down to 560 kg to 2000 km"   # [UM s 1]
  launch_mode: silo launch from the transport-and-launch container   # [UM s 7.2.4]

  stages:
    - name: Stage 1
      engines: 4 autonomous single-chamber liquid engines   # [UM s 2]; [ext][rockot] 3 x RD-0233 + RD-0234
      separation_time: 126.1  # s [UM f 3.4]; Fig. 7.1 shows thrust cutoff near 123 s
      max_axial_g: 8.7        # [UM t 7.2]
      staging: separation by solid-propellant retro motors   # [UM s 2]
      thrust: null            # not given; Rockot UG: isp_vac 310, isp_sl 285 [rockot]
    - name: Stage 2
      engines: liquid sustainer + 4-chamber steering engine   # [UM s 2]; [ext][rockot] RD-0235 + RD-0236
      burn: [126.1, 309.1]    # s, 183 s [UM f 3.4]; Rockot UG also gives 183 s [rockot]
      max_axial_g: 6.7        # [UM t 7.2]
      thrust: null            # Rockot UG: isp_vac 320 [rockot]
    - name: MIS
      role: >-
        Mechanisms and instruments section: autonomous control system, power and a propulsion unit
        that stabilises the coast and gives a single velocity pulse at transfer-orbit apogee [UM s 2, 3.2]
      burn: [1575, 1760]      # s, 185 s, 1000 km / 90 deg reference mission [UM f 3.4]
      delta_v: 477            # m/s [der] 7371 - 6894 at constant altitude and flight path angle 0 [UM f 3.4]
      max_axial_g: 0.4        # [UM t 7.2]

  space_head_section:
    measuring_instruments_compartment: {diameter: 2.4, height: 0.8}   # m [UM s 2]
    shs1: {fairing_top_dia: 1.300, base_dia: 2.200, payload_zone_height: 2.950, payload_bonus_kg: 105}   # [UM f 2.2, s 3.1]
    shs2: {note: "longer, ogive fairing; curves in Figs 3.1-3.3 are for SHS-2", payload_bonus_kg: 0}
    adapter_base_dia: 1.500    # m; interfaces 937, 1194, 1666 mm [UM s 4.2]
    fairing_jettison_altitude: [110, 150]   # km [UM s 2]
    separation: 4 spring pushers, 12 kgm (<= 800 kg SC) or 20 kgm (800-2000 kg), >= 0.6 m/s   # [UM s 4.2]

launch_sites:
  Svobodny: {inclinations: "51.8-61, 90-99 deg and SSO", note: "main site from 2000 [UM s 1]; no coordinates; ~51.8 N 128.4 E [ext]"}
  Baikonur: {inclinations: "62.8 deg", note: "[UM s 3.1]; ~45.9 N 63.3 E [ext]"}

loads:                       # [UM t 7.2], at S/C c.g.
  stage1: {axial_g: 8.7, lateral_g: 2.0}
  stage2: {axial_g: 6.7, lateral_g: 0.5}
  mis:    {axial_g: 0.4, lateral_g: 0.1}
acoustic_db: {silo_launch: 149, max_q: 140}   # 2.5 s / 30 s [UM t 7.8]
random_vib_grms: 5.1                          # boost phase, 300 s [UM t 7.5]
fairing_heat_flux_max_w_m2:                   # inner surface [UM t 7.9, 7.10]
  shs1: {250km: {sphere: 230, cone: 465, cylinder: 190}, 2000km: {sphere: 190, cone: 330, cylinder: 155}}
  shs2: {250km: {sphere: 410, cone14: 1120, cone3: 630, cylinder: 1000}, 2000km: {sphere: 380, cone14: 810, cone3: 480, cylinder: 820}}
fairing_dp_max: 0.01         # kgf/cm2 inside vs outside [UM s 7.4]

injection_accuracy: {altitude: "<= 1 %", inclination_deg: 0.05}   # [UM s 3.3]
separation_rates_deg_s: {mis_before: 2.0, sc_after: 2.5}           # [UM s 3.4]
