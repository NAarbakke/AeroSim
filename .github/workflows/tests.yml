# Run the test suite on Linux (and Windows) for every push and pull request.
# openMotor (GPL, not on PyPI) is not installed here; its cross-check tests skip.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv --python 3.12 .venv
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          uv pip install --python "$PY" -e '.[all,dev]'
          uv pip install --python "$PY" tifffile pyproj scikit-image cvxpy jsbsim
          # pyCycle: the PyPI release fails on numpy 2.5 (see README)
          uv pip install --python "$PY" "git+https://github.com/OpenMDAO/pyCycle@ee7e161"
      - name: Lint
        run: $PY -m ruff check aerosim examples tests
      - name: Test
        run: $PY -m pytest -q
